name: "smoke_L256"
iterations: 2
params:
  experiment: {world_model: "kalmamba"}
  trainer: {objective: {regularization_scale: 0.0, kl: {alpha: 0.5, initial_scale_factor: 0.0}}}
  rl: {rl_exp: {model_updt_seq_length: 256, model_updt_steps: 20}}
  policy_eval: {reward_eval: {eval_interval: 1, num_sequences: 1}}
